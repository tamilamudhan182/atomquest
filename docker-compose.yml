services:
  postgres:
    image: postgres:16-alpine
    container_name: atomquest-goal-db
    environment:
      POSTGRES_USER: atomquest
      POSTGRES_PASSWORD: atomquest
      POSTGRES_DB: atomquest_goals
    ports:
      - "5432:5432"
    volumes:
      - atomquest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atomquest -d atomquest_goals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atomquest-postgres:
