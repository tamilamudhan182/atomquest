services:
  - type: web
    name: atomquest-goal-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atomquest-goals-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_SCHEDULER
        value: true

databases:
  - name: atomquest-goals-db
    plan: free
